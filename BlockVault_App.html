<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#69e56f"><title>BlockVault</title>
<style>
body{margin:0;background:#070b08;color:#fff;font-family:Arial,sans-serif}header{padding:18px;text-align:center;border-bottom:1px solid #293529;background:#101610}.logo{font-size:28px;font-weight:900;color:#69e56f}.hero{padding:42px 22px;text-align:center;background:linear-gradient(135deg,#18301b,#0d150e)}h1{font-size:42px;margin:0 0 12px}.green{color:#69e56f}p{color:#b7c2b8;line-height:1.6}.search{margin:25px auto;max-width:600px;display:flex}.search input{flex:1;padding:15px;border-radius:12px 0 0 12px;border:1px solid #39473b;background:#0b110c;color:white}.search button{border:0;background:#69e56f;padding:0 18px;font-weight:bold;border-radius:0 12px 12px 0}.grid{max-width:900px;margin:28px auto;padding:0 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.card{background:#111711;border:1px solid #293329;border-radius:17px;padding:20px}.icon{font-size:45px}.tag{display:inline-block;background:#1b251c;color:#aeeab2;padding:5px 8px;border-radius:8px;font-size:11px;margin:3px}.btn{display:block;text-align:center;background:#69e56f;color:#071008;text-decoration:none;padding:12px;border-radius:10px;font-weight:900;margin-top:15px}footer{text-align:center;padding:25px;color:#849084;border-top:1px solid #263126}
</style></head><body><header><div class="logo">BLOCKVAULT</div></header>
<section class="hero"><h1>Welcome to <span class="green">BlockVault</span></h1><p>Minecraft Mods • Add-ons • Worlds</p><div class="search"><input id="q" placeholder="Search mods..."><button onclick="go()">Search</button></div></section>
<div class="grid" id="grid"></div><footer>© 2026 BlockVault</footer>
<script>
const x=[["🌙","Night Vision","Mods"],["🌳","Tree Capitator + Vein Miner","Mods"],["🟫","One Block World","Worlds"],["🚫","Jai's No Button","Mods"]];
function go(){let q=document.getElementById("q").value.toLowerCase();document.getElementById("grid").innerHTML=x.filter(a=>(a[0]+a[1]+a[2]).toLowerCase().includes(q)).map(a=>`<div class="card"><div class="icon">${a[0]}</div><h2>${a[1]}</h2><span class="tag">${a[2]}</span><span class="tag">Minecraft</span><a class="btn" href="#" onclick="alert('Connect the licensed download file here.')">Download</a></div>`).join("")||"<p>No results found.</p>"}
go();
</script></body></html>
